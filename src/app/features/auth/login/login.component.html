<mat-card class="login-mat-card">
  <mat-card-content>
    <form class="login" [formGroup]="userForm" (ngSubmit)="submitForm()">
      <h2 class="login__heading">Restaurant Portal</h2>
      <p class="login__desc">Log in to manage orders, menus, and stats.</p>

      <mat-form-field appearance="outline" class="login__input">
        <mat-label>Email Address</mat-label>
        <input
          matInput
          placeholder="Enter email address"
          formControlName="email"
          type="email"
        />

        <mat-error *ngIf="userForm.get('email')?.hasError('required')">
          Email is <strong>required</strong>.
        </mat-error>
        <mat-error *ngIf="userForm.get('email')?.hasError('email')">
          Please enter a <strong>valid</strong> email address.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="login__input">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          placeholder="Enter password"
          formControlName="password"
          [type]="passwordHidden ? 'password' : 'text'"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="passwordHidden = !passwordHidden"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="passwordHidden"
        >
          <mat-icon>{{
            passwordHidden ? 'visibility_off' : 'visibility'
          }}</mat-icon>
        </button>

        <mat-error *ngIf="userForm.get('password')?.hasError('required')">
          Password is <strong>required</strong>.
        </mat-error>
        <mat-error *ngIf="userForm.get('password')?.hasError('minlength')">
          Password must be at least <strong>8 characters</strong> long.
        </mat-error>
      </mat-form-field>

      <button
        type="submit"
        mat-raised-button
        color="primary"
        class="login__btn"
      >
        <ng-container *ngIf="!loading">Login</ng-container>
        <mat-spinner
          *ngIf="loading"
          color="accent"
          diameter="20"
          class="loading-spinner"
        ></mat-spinner>
      </button>
    </form>
  </mat-card-content>
</mat-card>
