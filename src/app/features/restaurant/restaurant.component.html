<div class="restaurant">
  <div class="restaurant__content">
    <div>
      <h1>Restaurants</h1>
      <p class="restaurant__desc">
        Manage partner restaurants and ownership list.
      </p>
    </div>
    <button mat-raised-button color="primary" [routerLink]="'/restaurant/add'">
      <mat-icon>add_2</mat-icon>
      ADD RESTAURANT
    </button>
  </div>

  <app-table-card
    class="restaurant__table-card"
    [dataSource]="displayRestaurantData"
  ></app-table-card>
</div>
