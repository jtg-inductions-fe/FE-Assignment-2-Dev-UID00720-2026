<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 table-card">
  <ng-container matColumnDef="Restaurant Name">
    <th mat-header-cell *matHeaderCellDef>Restaurant Name</th>
    <td mat-cell class="table-card__data-name" *matCellDef="let element">
      {{ element.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="Address">
    <th mat-header-cell *matHeaderCellDef>Address</th>
    <td mat-cell *matCellDef="let element">{{ element.address }}</td>
  </ng-container>

  <ng-container matColumnDef="Owners">
    <th mat-header-cell *matHeaderCellDef>Owners</th>
    <td mat-cell *matCellDef="let element">
      <mat-chip-set>
        <mat-chip *ngFor="let email of element.owners">
          {{ email }}
        </mat-chip>
      </mat-chip-set>
    </td>
  </ng-container>

  <ng-container matColumnDef="Actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let element">
      <button
        mat-stroked-button
        color="primary"
        class="table-card__btn"
        [routerLink]="[editRestaurantUrl, element.id]"
      >
        <mat-icon>edit</mat-icon>
        Edit
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
