<mat-tree
  [dataSource]="dataSource"
  [treeControl]="treeControl"
  class="example-tree"
>
  <!-- This is the tree node template for leaf nodes -->
  <!-- There is inline padding applied to this node using styles.
    This padding value depends on the mat-icon-button width. -->
  <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle>
    <a
      class="nav-links"
      [routerLink]="node.link"
      routerLinkActive="active-link-class"
    >
      <mat-icon class="side-nav-icons">{{ node.icon }}</mat-icon>
      {{ node.name }}
    </a>
  </mat-tree-node>
  <!-- This is the tree node template for expandable nodes -->
  <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
    <div class="mat-tree-node">
      <mat-icon class="side-nav-icons">{{ node.icon }}</mat-icon>
      {{ node.name }}
      <button
        mat-icon-button
        matTreeNodeToggle
        [attr.aria-label]="'Toggle ' + node.name"
      >
        <mat-icon class="mat-icon-rtl-mirror">
          {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
        </mat-icon>
      </button>
    </div>
    <!-- There is inline padding applied to this div using styles.
          This padding value depends on the mat-icon-button width.  -->
    <div
      [class.example-tree-invisible]="!treeControl.isExpanded(node)"
      role="group"
    >
      <ng-container matTreeNodeOutlet></ng-container>
    </div>
  </mat-nested-tree-node>
</mat-tree>

<mat-divider></mat-divider>

<mat-tree
  [dataSource]="commonData"
  [treeControl]="commonDataTreeControl"
  class="example-tree"
>
  <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle>
    <a
      class="nav-links"
      [routerLink]="node.link"
      routerLinkActive="active-link-class"
    >
      <mat-icon class="side-nav-icons">{{ node.icon }}</mat-icon>
      {{ node.name }}
    </a>
  </mat-tree-node>
  <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
    <div class="mat-tree-node">
      <mat-icon class="side-nav-icons">{{ node.icon }}</mat-icon>
      {{ node.name }}
      <button
        mat-icon-button
        matTreeNodeToggle
        [attr.aria-label]="'Toggle ' + node.name"
      >
        <mat-icon class="mat-icon-rtl-mirror">
          {{
            commonDataTreeControl.isExpanded(node)
              ? 'expand_more'
              : 'chevron_right'
          }}
        </mat-icon>
      </button>
    </div>
    <div
      [class.example-tree-invisible]="!commonDataTreeControl.isExpanded(node)"
      role="group"
    >
      <ng-container matTreeNodeOutlet></ng-container>
    </div>
  </mat-nested-tree-node>
</mat-tree>

<div class="side-nav-footer">
  <mat-icon>tune</mat-icon>
  <mat-icon>public</mat-icon>
  <mat-icon>settings</mat-icon>
</div>
