<div class="failure-page">
  <img
    class="failure-page__img"
    alt=""
    [src]="isErrorRoute ? errorImg : pageNotFoundImg"
  />
  <h1 class="failure-page__heading">
    {{ isErrorRoute ? errorHeading : pageNotFoundHeading }}
  </h1>
  <p class="failure-page__body">
    {{ isErrorRoute ? errorPara : pageNotFoundPara }}
  </p>
  <button
    mat-raised-button
    color="primary"
    class="failure-page__btn"
    [routerLink]="'/dashboard'"
  >
    Go Back Home
  </button>
</div>
